<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ECO-S | Sistema de Estaciones de Café</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased">

    <nav class="bg-emerald-700 text-white shadow-md px-6 py-4 flex justify-between items-center">
        <div class="flex items-center space-x-3">
            <i class="fa-solid fa-mug-hot text-2xl text-amber-300"></i>
            <div>
                <h1 class="text-xl font-bold tracking-tight">ECO-S Café</h1>
                <p class="text-xs text-emerald-200">Planta Física & Bienestar</p>
            </div>
        </div>
        <a href="TU_LINK_DE_MICROSOFT_FORMS_AQUÍ" target="_blank" 
           class="bg-amber-500 hover:bg-amber-600 text-slate-900 font-semibold px-4 py-2 rounded-lg shadow transition duration-200 flex items-center space-x-2">
            <i class="fa-solid fa-plus"></i>
            <span>Solicitar Estación</span>
        </a>
    </nav>

    <main class="max-w-7xl mx-auto p-4 sm:p-6 lg:p-8">
        
        <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 mb-6">
            <h2 class="text-lg font-semibold text-slate-700 mb-4 flex items-center gap-2">
                <i class="fa-solid fa-sliders text-emerald-600"></i> Filtros de Búsqueda
            </h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div>
                    <label class="block text-sm font-medium text-slate-600 mb-1">Buscar por Solicitante / Espacio</label>
                    <input type="text" id="searchGlobal" oninput="filtrarDatos()" placeholder="Ej: Magistral, L511..." 
                           class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-600 mb-1">Fecha del Servicio</label>
                    <input type="date" id="searchFecha" onchange="filtrarDatos()" 
                           class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500">
                </div>
                <div class="flex items-end">
                    <button onclick="limpiarFiltros()" class="w-full bg-slate-200 hover:bg-slate-300 text-slate-700 font-medium py-2 px-4 rounded-lg transition">
                        Limpiar Filtros
                    </button>
                </div>
            </div>
        </div>

        <div id="loading" class="text-center py-12">
            <i class="fa-solid fa-circle-notch animate-spin text-4xl text-emerald-600 mb-3"></i>
            <p class="text-slate-500">Cargando cronograma desde la nube institucional...</p>
        </div>

        <div id="gridEstaciones" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 hidden"></div>

        <div id="noResults" class="hidden text-center py-12 bg-white rounded-xl border border-dashed border-slate-300">
            <i class="fa-regular fa-calendar-times text-4xl text-slate-400 mb-2"></i>
            <p class="text-slate-500 font-medium">No hay estaciones programadas para esta selección.</p>
        </div>
    </main>

    <script>
        // Apunta al archivo JSON local que actualizará Power Automate
        const DATA_FILE = "./estaciones.json"; 
        let datosOriginales = [];

        async function cargarEstaciones() {
            try {
                const response = await fetch(DATA_FILE);
                if (!response.ok) throw new Error("No se encontró el archivo de datos.");
                
                const data = await response.json();
                // Omitimos la primera fila si son los encabezados (ID, Hora de inicio...)
                datosOriginales = data.slice(1); 
                
                document.getElementById('loading').classList.add('hidden');
                renderizarTarjetas(datosOriginales);
            } catch (error) {
                console.error(error);
                document.getElementById('loading').innerHTML = `
                    <i class="fa-solid fa-circle-exclamation text-amber-500 text-4xl mb-2"></i>
                    <p class="text-slate-600 font-medium">Sincronizando primera base de datos o sin registros aún.</p>
                `;
            }
        }

        function renderizarTarjetas(lista) {
            const grid = document.getElementById('gridEstaciones');
            const noResults = document.getElementById('noResults');
            grid.innerHTML = "";

            if(lista.length === 0) {
                grid.classList.add('hidden');
                noResults.classList.remove('hidden');
                return;
            }

            grid.classList.remove('hidden');
            noResults.classList.add('hidden');

            lista.forEach(row => {
                // Mapeo exacto según tu CSV:
                // [0]ID, [1]Inicio, [2]Fin, [3]Fecha, [4]Horario, [5]Lugar, [6]Insumos, [7]Cant, [8]Recargas, [9]Solicitante
               const fecha = row.fecha || 'N/A';
                const horario = row.horario || 'N/A';
                const lugar = row.lugar || 'No asignado';
                const insumos = row.insumos ? row.insumos.split(';').filter(i => i.trim() !== '') : [];
                const personas = row.personas || 'N/A';
                const recargas = row.recargas || 'Sin recargas';
                const solicitante = row.solicitante || 'Área no especificada';

                const tarjeta = document.createElement('div');
                tarjeta.className = "bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden hover:shadow-md transition duration-200 flex flex-col justify-between";
                
                let tagsHtml = insumos.map(i => `<span class="bg-emerald-50 text-emerald-700 text-xs font-semibold px-2 py-1 rounded border border-emerald-200">${i.trim()}</span>`).join(' ');

                tarjeta.innerHTML = `
                    <div class="p-5">
                        <div class="flex justify-between items-start mb-3">
                            <span class="text-xs font-bold uppercase tracking-wider text-slate-400 flex items-center gap-1">
                                <i class="fa-regular fa-calendar"></i> ${fecha}
                            </span>
                            <span class="bg-amber-100 text-amber-800 text-xs font-bold px-2.5 py-0.5 rounded-full flex items-center gap-1">
                                <i class="fa-regular fa-clock"></i> ${horario}
                            </span>
                        </div>
                        <h3 class="text-lg font-bold text-slate-800 mb-1 flex items-center gap-2">
                            <i class="fa-solid fa-location-dot text-emerald-600"></i> ${lugar}
                        </h3>
                        <p class="text-sm text-slate-500 mb-4">
                            <i class="fa-solid fa-user text-xs"></i> <span class="font-medium">${solicitante}</span>
                        </p>
                        <div class="flex flex-wrap gap-1.5 mb-4">
                            ${tagsHtml}
                        </div>
                    </div>
                    <div class="bg-slate-50 px-5 py-3 border-t border-slate-100 flex justify-between text-xs text-slate-600">
                        <span><i class="fa-solid fa-users text-slate-400"></i> Capacidad: <strong>${personas}</strong></span>
                        <span class="text-right truncate max-w-[150px]" title="${recargas}"><i class="fa-solid fa-rotate text-slate-400"></i> ${recargas}</span>
                    </div>
                `;
                grid.appendChild(tarjeta);
            });
        }

        function filtrarDatos() {
            const query = document.getElementById('searchGlobal').value.toLowerCase();
            const fecha = document.getElementById('searchFecha').value;

            const filtrados = datosOriginales.filter(row => {
                const matchGlobal = !query || 
                                    (row[5] && row[5].toLowerCase().includes(query)) || 
                                    (row[9] && row[9].toLowerCase().includes(query));
                
                let matchFecha = true;
                if(fecha) {
                    const rowFecha = row[3] ? row[3].split('T')[0] : '';
                    matchFecha = rowFecha.includes(fecha);
                }
                return matchGlobal && matchFecha;
            });
            renderizarTarjetas(filtrados);
        }

        function limpiarFiltros() {
            document.getElementById('searchGlobal').value = "";
            document.getElementById('searchFecha').value = "";
            renderizarTarjetas(datosOriginales);
        }

        window.onload = cargarEstaciones;
    </script>
</body>
</html>
