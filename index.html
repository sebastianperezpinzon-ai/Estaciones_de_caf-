<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ECO-S | Logística de Espacios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .eco-header { background-color: #2c3e50; color: white; padding: 20px 0; border-bottom: 5px solid #27ae60; }
        .card-estacion { border-left: 5px solid #27ae60; margin-bottom: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .estado-pendiente { background-color: #f1c40f; color: #fff; padding: 3px 8px; border-radius: 12px; font-size: 0.8em; font-weight: bold;}
        .recarga-badge { background-color: #e8f8f5; color: #16a085; font-size: 0.85em; padding: 4px 8px; border-radius: 4px; display: inline-block; margin-top: 5px;}
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div class="eco-header text-center mb-5">
    <h1>ECO-S: Dashboard Logístico</h1>
    <p>Gestión Inteligente y Sostenible de Insumos - Planta Física</p>
</div>

<div class="container-fluid px-5">
    <div class="row">
        <div class="col-md-4 mb-4">
            <div class="card p-4 shadow-sm">
                <h4 class="mb-3 text-success">Nueva Solicitud</h4>
                <form id="formulario-estacion">
                    
                    <div class="mb-3">
                        <label class="form-label text-muted">Solicitante (Área o Persona)</label>
                        <input type="text" class="form-control" id="solicitante" placeholder="Ej: Dirección Académica, Juan Pérez..." required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label text-muted">Ubicación / Salón o Espacio</label>
                        <input type="text" class="form-control" id="ubicacion" placeholder="Ej: L511, Auditorio Fundadores..." required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label text-muted">Fecha y Hora de la Sesión</label>
                        <input type="datetime-local" class="form-control" id="fecha_requerida" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label text-muted">Insumos Requeridos</label>
                        <div class="form-check">
                            <input class="form-check-input insumo-check" type="checkbox" value="Café" id="chkCafe">
                            <label class="form-check-label" for="chkCafe">Café (Termo 2L)</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input insumo-check" type="checkbox" value="Agua" id="chkAgua">
                            <label class="form-check-label" for="chkAgua">Agua (Dispensador)</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input insumo-check" type="checkbox" value="Aromática" id="chkAro">
                            <label class="form-check-label" for="chkAro">Aromáticas variadas</label>
                        </div>
                    </div>

                    <div class="mb-3 border-top pt-3">
                        <label class="form-label text-muted d-block">¿Lleva recargas?</label>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="opcionRecarga" id="recargaSi" value="Si">
                            <label class="form-check-label" for="recargaSi">Sí</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="opcionRecarga" id="recargaNo" value="No" checked>
                            <label class="form-check-label" for="recargaNo">No</label>
                        </div>
                    </div>

                    <div class="mb-3 d-none" id="divHorasRecargas">
                        <label class="form-label text-muted">Horarios de las recargas</label>
                        <input type="text" class="form-control" id="horas_recargas" placeholder="Ej: 10:00 am y 3:00 pm">
                    </div>

                    <button type="submit" class="btn btn-success w-100 mt-3">Registrar y Procesar</button>
                    <div id="mensaje-alerta" class="mt-3"></div>
                </form>
            </div>
        </div>

        <div class="col-md-8">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h4 class="text-secondary">Monitoreo de Estaciones Activas</h4>
                <button class="btn btn-outline-secondary btn-sm" onclick="cargarEstaciones()">↻ Actualizar Datos</button>
            </div>
            
            <div id="contenedor-tarjetas" class="row">
                <div class="text-center text-muted mt-5">Cargando la red espacial...</div>
            </div>
        </div>
    </div>
</div>

<script>
    const SUPABASE_URL = 'https://dqylacedhygmmdyywsib.supabase.co'; 
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRxeWxhY2VkaHlnbW1keXl3c2liIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI0NDk2MDYsImV4cCI6MjA5ODAyNTYwNn0.YgAYtLk7MJOiEijg9fWkV0Em_COpKbfpg7bWz8pVQOo'; 
    
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // Lógica para mostrar/ocultar el campo de recargas
    document.querySelectorAll('input[name="opcionRecarga"]').forEach(radio => {
        radio.addEventListener('change', function() {
            const divHoras = document.getElementById('divHorasRecargas');
            if (this.value === 'Si') {
                divHoras.classList.remove('d-none');
            } else {
                divHoras.classList.add('d-none');
                document.getElementById('horas_recargas').value = ''; // Limpiar el texto si se arrepiente
            }
        });
    });

    async function cargarEstaciones() {
        const contenedor = document.getElementById('contenedor-tarjetas');
        contenedor.innerHTML = '<div class="text-center text-muted">Sincronizando sensores...</div>';

        const { data, error } = await supabaseClient
            .from('estaciones_cafe')
            .select('*')
            .order('fecha_requerida', { ascending: true });

        if (error) {
            console.error("Error al cargar:", error);
            contenedor.innerHTML = '<div class="alert alert-danger">Error conectando con la matriz de datos.</div>';
            return;
        }

        contenedor.innerHTML = ''; 

        if (data.length === 0) {
            contenedor.innerHTML = '<div class="text-center text-muted mt-4">No hay estaciones pendientes. El campus está optimizado.</div>';
            return;
        }

        data.forEach(estacion => {
            const fechaOptimizada = new Date(estacion.fecha_requerida).toLocaleString('es-CO', { dateStyle: 'medium', timeStyle: 'short' });
            const solicitante = estacion.solicitante ? estacion.solicitante : 'Usuario no registrado';
            
            // Construir el bloque visual de recargas si aplica
            let infoRecargas = '';
            if (estacion.lleva_recargas === 'Si' && estacion.horas_recargas) {
                infoRecargas = `<div class="recarga-badge">🔄 Recargas: ${estacion.horas_recargas}</div>`;
            }
            
            const tarjeta = `
                <div class="col-md-6">
                    <div class="card card-estacion p-3">
                        <div class="d-flex justify-content-between align-items-start">
                            <h5 class="card-title text-dark mb-1">📍 ${estacion.ubicacion}</h5>
                            <span class="estado-pendiente">${estacion.estado || 'Pendiente'}</span>
                        </div>
                        <p class="text-muted mb-2" style="font-size: 0.9em;">👤 ${solicitante}</p>
                        <hr class="text-muted mt-1 mb-2">
                        <p class="card-text mb-1"><strong>⏰ Inicio:</strong> ${fechaOptimizada}</p>
                        <p class="card-text mb-1"><strong>☕ Insumos:</strong> ${estacion.insumos}</p>
                        ${infoRecargas}
                    </div>
                </div>
            `;
            contenedor.innerHTML += tarjeta;
        });
    }

    document.getElementById('formulario-estacion').addEventListener('submit', async function(e) {
        e.preventDefault(); 

        const solicitante = document.getElementById('solicitante').value;
        const ubicacion = document.getElementById('ubicacion').value;
        const fechaReq = document.getElementById('fecha_requerida').value;
        
        // Recargas
        const llevaRecargas = document.querySelector('input[name="opcionRecarga"]:checked').value;
        let horasRecargas = null;
        if (llevaRecargas === 'Si') {
            horasRecargas = document.getElementById('horas_recargas').value;
        }

        const checkboxes = document.querySelectorAll('.insumo-check:checked');
        const insumosSeleccionados = Array.from(checkboxes).map(chk => chk.value).join(', ');

        if(insumosSeleccionados === "") {
            mostrarAlerta('Debes seleccionar al menos un insumo.', 'danger');
            return;
        }

        const { data, error } = await supabaseClient
            .from('estaciones_cafe')
            .insert([
                { 
                    solicitante: solicitante,
                    ubicacion: ubicacion, 
                    fecha_requerida: fechaReq, 
                    insumos: insumosSeleccionados,
                    lleva_recargas: llevaRecargas,
                    horas_recargas: horasRecargas
                }
            ]);

        if (error) {
            mostrarAlerta('Error en la comunicación: ' + error.message, 'danger');
        } else {
            mostrarAlerta('Datos guardados exitosamente. Optimizando insumos...', 'success');
            document.getElementById('formulario-estacion').reset(); 
            // Ocultar de nuevo el campo de horas tras limpiar el form
            document.getElementById('divHorasRecargas').classList.add('d-none');
            cargarEstaciones(); 
        }
    });

    function mostrarAlerta(mensaje, tipo) {
        const alertaDiv = document.getElementById('mensaje-alerta');
        alertaDiv.innerHTML = `<div class="alert alert-${tipo}">${mensaje}</div>`;
        setTimeout(() => alertaDiv.innerHTML = '', 4000); 
    }

    window.onload = cargarEstaciones;
</script>
</body>
</html>
</html>
