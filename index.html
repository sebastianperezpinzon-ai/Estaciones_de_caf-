<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ECO-S | Logística de Espacios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .eco-header { background-color: #2c3e50; color: white; padding: 20px 0; border-bottom: 5px solid #27ae60; }
        .card-estacion { border-left: 5px solid #27ae60; margin-bottom: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .estado-pendiente { background-color: #f1c40f; color: #fff; padding: 3px 8px; border-radius: 12px; font-size: 0.8em; font-weight: bold;}
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div class="eco-header text-center mb-5">
    <h1>ECO-S: Dashboard Logístico</h1>
    <p>Gestión Inteligente y Sostenible de Insumos - Planta Física</p>
</div>

<div class="container-fluid px-5">
    <div class="row">
        <div class="col-md-4 mb-4">
            <div class="card p-4 shadow-sm">
                <h4 class="mb-3 text-success">Nueva Solicitud</h4>
                <form id="formulario-estacion">
                    
                    <div class="mb-3">
                        <label class="form-label text-muted">Ubicación / Salón o Espacio</label>
                        <input type="text" class="form-control" id="ubicacion" placeholder="Ej: L511, Auditorio Fundadores, Sala Juntas..." required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label text-muted">Fecha y Hora de la Sesión</label>
                        <input type="datetime-local" class="form-control" id="fecha_requerida" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label text-muted">Insumos Requeridos (Selección múltiple)</label>
                        <div class="form-check">
                            <input class="form-check-input insumo-check" type="checkbox" value="Café" id="chkCafe">
                            <label class="form-check-label" for="chkCafe">Café (Termo 2L)</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input insumo-check" type="checkbox" value="Agua" id="chkAgua">
                            <label class="form-check-label" for="chkAgua">Agua (Dispensador)</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input insumo-check" type="checkbox" value="Aromática" id="chkAro">
                            <label class="form-check-label" for="chkAro">Aromáticas variadas</label>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-success w-100 mt-2">Registrar y Procesar</button>
                    <div id="mensaje-alerta" class="mt-3"></div>
                </form>
            </div>
        </div>

        <div class="col-md-8">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h4 class="text-secondary">Monitoreo de Estaciones Activas</h4>
                <button class="btn btn-outline-secondary btn-sm" onclick="cargarEstaciones()">↻ Actualizar Datos</button>
            </div>
            
            <div id="contenedor-tarjetas" class="row">
                <div class="text-center text-muted mt-5">Cargando la red espacial...</div>
            </div>
        </div>
    </div>
</div>

<script>
    // 1. INICIALIZAR LA CONEXIÓN A SUPABASE (Credenciales integradas de forma óptima)
    const SUPABASE_URL = 'https://dqylacedhygmmdyywsib.supabase.co'; 
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRxeWxhY2VkaHlnbW1keXl3c2liIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI0NDk2MDYsImV4cCI6MjA5ODAyNTYwNn0.YgAYtLk7MJOiEijg9fWkV0Em_COpKbfpg7bWz8pVQOo'; 
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // 2. FUNCIÓN PARA CARGAR LOS DATOS (El Dashboard)
    async function cargarEstaciones() {
        const contenedor = document.getElementById('contenedor-tarjetas');
        contenedor.innerHTML = '<div class="text-center text-muted">Sincronizando sensores...</div>';

        const { data, error } = await supabase
            .from('estaciones_cafe')
            .select('*')
            .order('fecha_requerida', { ascending: true });

        if (error) {
            console.error("Error al cargar:", error);
            contenedor.innerHTML = '<div class="alert alert-danger">Error conectando con la matriz de datos.</div>';
            return;
        }

        contenedor.innerHTML = ''; 

        if (data.length === 0) {
            contenedor.innerHTML = '<div class="text-center text-muted mt-4">No hay estaciones pendientes. El campus está optimizado.</div>';
            return;
        }

        data.forEach(estacion => {
            const fechaOptimizada = new Date(estacion.fecha_requerida).toLocaleString('es-CO', { dateStyle: 'medium', timeStyle: 'short' });
            
            const tarjeta = `
                <div class="col-md-6">
                    <div class="card card-estacion p-3">
                        <div class="d-flex justify-content-between align-items-start">
                            <h5 class="card-title text-dark mb-1">📍 ${estacion.ubicacion}</h5>
                            <span class="estado-pendiente">${estacion.estado}</span>
                        </div>
                        <hr class="text-muted">
                        <p class="card-text mb-1"><strong>⏰ Requerido para:</strong> <br> ${fechaOptimizada}</p>
                        <p class="card-text"><strong>☕ Insumos:</strong> <br> ${estacion.insumos}</p>
                    </div>
                </div>
            `;
            contenedor.innerHTML += tarjeta;
        });
    }

    // 3. FUNCIÓN PARA GUARDAR DATOS (El Formulario)
    document.getElementById('formulario-estacion').addEventListener('submit', async function(e) {
        e.preventDefault(); 

        const ubicacion = document.getElementById('ubicacion').value;
        const fechaReq = document.getElementById('fecha_requerida').value;
        
        const checkboxes = document.querySelectorAll('.insumo-check:checked');
        const insumosSeleccionados = Array.from(checkboxes).map(chk => chk.value).join(', ');

        if(insumosSeleccionados === "") {
            mostrarAlerta('Debes seleccionar al menos un insumo.', 'danger');
            return;
        }

        const { data, error } = await supabase
            .from('estaciones_cafe')
            .insert([
                { ubicacion: ubicacion, fecha_requerida: fechaReq, insumos: insumosSeleccionados }
            ]);

        if (error) {
            mostrarAlerta('Error en la comunicación: ' + error.message, 'danger');
        } else {
            mostrarAlerta('Datos guardados exitosamente. Optimizando insumos...', 'success');
            document.getElementById('formulario-estacion').reset(); 
            cargarEstaciones(); // Refrescar el panel visual instantáneamente
        }
    });

    function mostrarAlerta(mensaje, tipo) {
        const alertaDiv = document.getElementById('mensaje-alerta');
        alertaDiv.innerHTML = `<div class="alert alert-${tipo}">${mensaje}</div>`;
        setTimeout(() => alertaDiv.innerHTML = '', 4000); 
    }

    window.onload = cargarEstaciones;
</script>
</body>
</html>
